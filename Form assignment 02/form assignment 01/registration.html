<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registraion Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>Register</h1>

        <p>Kindly fill in this form to register.</p>

        <form>

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter user name" required>

            <label for="mail">Email</label>
            <input type="email" id="mAil" placeholder="Enter Your Email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Password" required>

            <label for="repeat-password">Repeat Password</label>
            <input type="password" id="repeat-password" placeholder="repeat Password" required>

            <button type="submit">Register</button>
        </form>

        <p class="login">Already have an account?
            <a href="#">Log in</a>
        </p>

    </div>
</body>
</html>
