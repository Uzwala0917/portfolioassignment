<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(136, 200, 216);
            padding: 30px;
        }

        .grid-container {
            width: 100%;
            max-width: 700px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 150px 220px 190px;

            gap: 12px;
        }

        .grid-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Top two small images */
        .grapes {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
        }

        .strawberries {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }

        /* Large orange image */
        .Orange {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
        }

        /* Large watermelon image */
        .Watermelon {
            grid-column: 3 / 5;
            grid-row: 1 / 3;
        }

        /* Bottom left image */
        .Papaya {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
        }

        /* Bottom right image */
        .Pineapple {
            grid-column: 3 / 5;
            grid-row: 3 / 4;
        }

    </style>
</head>
<body>
    
    <div class="grid-container">
        <div class="grapes">
            <img src="https://images.stockcake.com/public/2/d/0/2d06982e-ea00-4657-abff-bbef8c605532_large/ripe-grape-bunch-stockcake.jpg" alt="">
        </div>

        <div class="strawberries">
            <img src="https://www.thesophisticatedcaveman.com/wp-content/uploads/2017/06/Strawberries.jpg" alt="">
        </div>


        <div class="Watermelon">
            <img src="https://hips.hearstapps.com/hmg-prod/images/fresh-ripe-watermelon-slices-on-wooden-table-royalty-free-image-1684966820.jpg?crop=0.6673xw:1xh;center,top&resize=640:*" alt="">
        </div>

        <div class="Orange">
            <img src="https://www.knowyourproduce.com/wp-content/uploads/2022/09/orange-slices.jpg" alt="">
        </div>

        <div class="Papaya">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQj5uh9vAQRkGi-1jZKL50CYibrB0hn8alq7NIjBWRhsnFfuswm6Ija5dY&s=10" alt="">
        </div>

        <div class="Pineapple">
            <img src="https://www.bbassets.com/media/uploads/p/l/10000156_31-fresho-pineapple.jpg" alt="">

    </div>
</body>
</html>
