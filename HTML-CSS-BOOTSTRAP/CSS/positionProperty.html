<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Box Image</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .container1{
            width: 50%;
            height: 400px;
            margin: 100px auto;
            position: relative;
        }
        body{
            background-color: blueviolet;
        }
        .whiteBox{
            height: 400px;
            width: 400px;
            background-color: white;
            position: absolute;
            left: 200px;
        }
        .firstIMG{
            position: absolute;
            top: -50px;
            right: 150px;
        }
        .firstIMG img{
            height: 200px;
            width: 200px;

        }
        .secondIMG{
            position: absolute;
            bottom: -50px;
            left: 150px;
        }
        .secondIMG img{
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container1">
        <div class="whiteBox"></div>
        <div class="firstIMG">
            <img src="./Screenshot_2022_02_16_at_9_30_14_am_copy.jpg" alt="">
        </div>
        <div class="secondIMG">
            <img src="./golden-logo-template-free-png.webp" alt="">
        </div>
    </div>



    
</body>
</html>
