<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">

        <div class="leftside">

            <div class="instalogo"></div>
            <div class="left-text">
                <h1>
                    See everyday moments from <br>
                    your <span>close friends.</span>
                </h1>
            </div>

            <div class="image">
                <img src="" alt="Instagram friends">
            </div>
        </div>


        <div class="rightside">

            <div class="login">

                <h3>Log into Instagram</h3>

                <form>
                    <input type="text" placeholder="Mobile number, username or email" required>

                    <input type="password" placeholder="Password" required>

                    <button type="submit" class="login-btn">Log in</button>
                </form>

                <a href="#" class="forgot">
                    Forgot Password
                </a>

                <div class="divider">
                    <span></span>
                    <p>OR</p>
                    <span></span>
                </div>

                <button class="facebook-btn">
                    <span>f</span>
                    Log in with Facebook
                </button>

                <button class="create-btn">
                    Create new account
                </button>

            </div>
        </div>

        


    </div>
</body>
</html>
