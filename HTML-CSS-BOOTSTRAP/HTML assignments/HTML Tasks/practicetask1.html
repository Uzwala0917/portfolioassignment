<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room registration form</title>
</head>
<body>
    
    <h1>Escape Room Registration Form</h1>
    <form>
    <label for="teamname">TeamName</label>
    <input type="text" id="teamname" name="Teamname" placeholder="enter team name" required>
    <br><br>

    <label for="count">Player Count</label>
    <input type="number" id="count" name="pcount" required><br><br>

    <label for="diff">Difficulty</label>
    <select id="diff" name="difficulty" required>
        <option value="Hard">Hard</option>
        <option value="Medium">Medium</option>
        <option value="Easy">Easy</option>
    </select><br><br>

    <label for="time">Preferred Time</label>
    <input type="time" id="time" name="time" required><br><br>

    <label for="pNames"> Player Names</label>
    <textarea id="pNmaes" name="players" placeholder="enter your name" roe="4" required>
    </textarea><br><br>

    <label for="rules">I agree to the rules</label>
    <input id="rules" type="checkbox" name="Rules" required><br><br>

    <button type="submit">Book Room</button>

</form>

</body>
</html>
